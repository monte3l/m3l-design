name: Verify

# Checks what this repository ships: the generated files are current, the
# resolver still reproduces tokens.json, SHA256SUMS matches the payload, the
# docs site builds and its documentation matches the payload, every
# script and workflow lints (actionlint, zizmor), and every file has its
# licensing declared (REUSE).
# The job name `verify` is what the org `main` ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Node version comes from .node-version, the single source of truth.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Generated files are current
        run: node bin/build-design-tokens.mjs --check

      - name: SHA256SUMS matches the payload
        run: sha256sum -c --quiet SHA256SUMS

      - name: Docs site builds, links resolve and docs match the payload
        run: node source/docs-kit/build.mjs --check

      - name: Resolver parity and credit files
        run: node --test

      - name: Script syntax and shellcheck
        run: |
          bash -n bin/*.sh
          shellcheck bin/*.sh

      - name: JSON files parse
        run: |
          find source artifact -name '*.json' -print0 \
            | xargs -0 -n1 jq empty

      - name: actionlint
        # Pinned by tag: Dependabot does not track this value, bump it by hand.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/*.yml
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows
          # Pinned: `latest` lets a new zizmor release change what fails.
          # Dependabot does not track this value, so bump it by hand.
          version: "1.31.1"
          # Offline audits only, so the step needs no token.
          online-audits: false
          advanced-security: false

      # Run through pipx (preinstalled on the runner) rather than fsfe/reuse-action:
      # the org only allows a short list of third-party actions. Dependabot does
      # not track this version, so bump it by hand.
      - name: REUSE compliance
        run: pipx run --spec 'reuse[charset-normalizer]==6.2.0' reuse lint
