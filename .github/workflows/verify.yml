name: Verify

# Checks what this repository ships: the generated files are current, the
# resolver still reproduces tokens.json, SHA256SUMS matches the payload, every
# script and workflow lints, and every file has its licensing declared (REUSE).
# The job name `verify` is what the org `main` ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Node version comes from .node-version, the single source of truth.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Generated files are current
        run: node bin/build-design-tokens.mjs --check

      - name: SHA256SUMS matches the payload
        run: sha256sum -c --quiet SHA256SUMS

      - name: Resolver parity and credit files
        run: node --test

      - name: Script syntax and shellcheck
        run: |
          bash -n bin/*.sh
          shellcheck bin/*.sh

      - name: JSON files parse
        run: |
          find source artifact -name '*.json' -print0 \
            | xargs -0 -n1 jq empty

      - name: actionlint
        # Pinned by tag: Dependabot does not track this value, bump it by hand.
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/*.yml

      - name: REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
