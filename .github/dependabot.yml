version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # A freshly published action version is the window an attacker needs;
    # the default cooldown of 0 leaves it open.
    cooldown:
      default-days: 7
    labels:
      - dependencies

  # .github/deploy-tools/ pins the exact wrangler version docs.yml installs,
  # through a committed lockfile. Its job holds a Cloudflare API token, so it
  # gets a one-day cooldown.
  - package-ecosystem: npm
    directory: /.github/deploy-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: ci
    labels:
      - dependencies
